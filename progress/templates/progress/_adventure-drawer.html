<dialog class="quest-preview" id="adventure-drawer">
  <aside class="preview-panel">
    <div class="preview-top">
      <span data-adventure-crumb></span>
      <span class="optional-badge" data-adventure-optional hidden>╌ OPTIONAL</span>
      <a class="preview-close" href="#" aria-label="Close">✕</a>
    </div>
    <h2 class="preview-title" data-quest-title></h2>
    <p class="preview-body" data-quest-description hidden></p>
    <div class="prereq-line" data-prerequisite-line hidden>
      ⛓ Requires:
      <span data-prerequisites-titles></span>
    </div>
    <div class="obj-heading">
      <h3>✦ OBJECTIVES</h3>
      <span class="obj-count" data-objectives-count></span>
    </div>
    <div class="obj-list" data-quest-objectives></div>
    <p class="obj-empty" data-empty-quest hidden>
      No trials set — this quest is illegal by the guild's Book of Questcrafting.
    </p>
  </aside>
</dialog>
