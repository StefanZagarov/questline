{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Questline — Guild hall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Alegreya:ital,wght@0,400..800;1,400..700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="{% static 'common/css/base.css' %}">
    {% block extra_css %}{% endblock %}
    {% block extra_js %}{% endblock %}
  </head>
  <body>
    {% block topbar %}
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand-row" href="{% url 'home' %}">
            <div class="logo-sm">
              <span class="logo-sm-field"><span class="logo-sm-mark"></span></span>
            </div>
            <div class="wordmark">QUESTLINE</div>
          </a>
          <nav class="topbar-nav" aria-label="Primary navigation">
            <a class="topbar-nav-link {% if request.resolver_match.url_name == 'home' %}is-current{% endif %}"
               href="{% url "home" %}">Home</a>
          </nav>
          <nav class="topbar-nav" aria-label="Primary navigation">
            <a class="topbar-nav-link {% if request.resolver_match.url_name == 'explore' %}is-current{% endif %}"
               href="{% url "explore" %}">Explore</a>
          </nav>
          <div class="spacer"></div>
          {% if user.is_authenticated %}
            <div class="topbar-actions">
              <div class="lv-badge" data-lv>LV 3</div>
              <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="leave-btn">LEAVE ⇥</button>
              </form>
            </div>
          {% else %}
            <div class="topbar-actions">
              <a class="leave-btn" href="{% url 'login' %}">LOGIN</a>
              <a class="lv-badge" href="{% url 'register' %}">REGISTER</a>
            </div>
          {% endif %}
        </div>
      </header>
    {% endblock %}
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
